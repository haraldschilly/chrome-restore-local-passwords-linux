[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrome-restore-local-passwords-linux"
version = "0.1.0"
description = "Decrypt locally-stored Chrome/Chromium passwords on Linux (GNOME Keyring) and export them to importable CSVs — one per profile."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harald Schilly", email = "harald.schilly@gmail.com" }]
keywords = ["chrome", "chromium", "passwords", "gnome-keyring", "linux", "oscrypt", "recovery", "csv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/haraldschilly/chrome-restore-local-passwords-linux"
Repository = "https://github.com/haraldschilly/chrome-restore-local-passwords-linux"
Issues = "https://github.com/haraldschilly/chrome-restore-local-passwords-linux/issues"

[project.scripts]
# Long name == package name so `uvx chrome-restore-local-passwords-linux@latest` works directly.
chrome-restore-local-passwords-linux = "chrome_restore_passwords:main"
# Convenient short alias once installed.
chrome-restore-passwords = "chrome_restore_passwords:main"

[tool.hatch.build.targets.wheel]
only-include = ["chrome_restore_passwords.py"]

[tool.hatch.build.targets.sdist]
include = ["chrome_restore_passwords.py", "README.md", "LICENSE"]
